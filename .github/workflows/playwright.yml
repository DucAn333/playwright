name: Playwright Tests

on:
  # 1. Chạy tự động khi push code lên nhánh main/master
  # push:
  #   branches: [ main, master ]
  
  # # 2. Chạy tự động khi tạo Pull Request vào main/master
  # pull_request:
  #   branches: [ main, master ]

  # 3. Cho phép bấm nút "Run workflow" chạy thủ công từ giao diện Web
  workflow_dispatch:

  # 4. Chạy hẹn giờ hàng ngày (10:00 UTC = 17:00 chiều giờ Việt Nam)
  schedule:
    - cron: '0 10 * * *'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers & OS Dependencies
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test --reporter=list,html
      env:
        CI: true

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30